<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FoundIt</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      max-width: 450px;
      margin: 2rem auto;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="brand">FoundIt</a>
    <div class="nav-links">
      <a href="login.html">Login</a>
    </div>
  </nav>

  <main>
    <div class="auth-container">
      <div class="card">
        <h2 class="text-center">Create Account</h2>
        <p class="text-center">Join FoundIt to report or claim items.</p>
        
        <form id="registerForm" class="mt-2">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="John Doe">
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="••••••••">
          </div>
          
          <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
        </form>

        <p class="text-center mt-2">
          Already have an account? <a href="login.html" style="color: var(--primary);">Login</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
