<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/system-check.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoundIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B, #0F172A);
    }
    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 1rem;
      animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .auth-card {
      padding: 3rem 2.5rem;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-color: var(--glass-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="text-center mb-2">
      <a href="index.html" class="brand" style="font-size: 2.5rem;">FoundIt</a>
    </div>

    <div class="card auth-card">
      <h1 class="text-center" style="font-size: 1.75rem;">Welcome Back</h1>
      <p class="text-center mb-2">Enter your credentials to access your account.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" spellcheck="false">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; height: 50px; font-size: 1.1rem; margin-top: 1rem;">Login</button>
      </form>

      <p class="text-center mt-2" style="font-size: 0.9rem;">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign up</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
