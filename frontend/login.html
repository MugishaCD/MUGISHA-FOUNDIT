<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoundIt</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      max-width: 450px;
      margin: 2rem auto;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="brand">FoundIt</a>
    <div class="nav-links">
      <a href="register.html">Sign Up</a>
    </div>
  </nav>

  <main>
    <div class="auth-container">
      <div class="card">
        <h2 class="text-center">Welcome Back</h2>
        <p class="text-center">Enter your credentials to access your account.</p>
        
        <form id="loginForm" class="mt-2">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          
          <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>

        <p class="text-center mt-2">
          Don't have an account? <a href="register.html" style="color: var(--primary);">Sign up</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
