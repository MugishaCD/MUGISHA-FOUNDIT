spring.application.name=foundit

# Database Configuration with Cloud Support
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/foundit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port (Render uses the PORT env var)
server.port=${PORT:8081}

