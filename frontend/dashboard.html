<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - FoundIt</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <a href="dashboard.html" class="brand">FoundIt</a>
    <div class="nav-links">
      <a href="dashboard.html" style="color: var(--primary);">Dashboard</a>
      <a href="lost-items.html">Lost Items</a>
      <a href="found-items.html">Found Items</a>
      <a href="claims.html">Claims & Matches</a>
      <a href="notifications.html">Notifications</a>
      <span id="userNameDisplay" style="margin-left: 1rem; font-weight: bold; color: var(--text-muted);"></span>
      <a href="#" id="logoutBtn" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; margin-left: 1rem;">Logout</a>
    </div>
  </nav>

  <main>
    <div class="flex-between mb-2">
      <h1>Dashboard Overview</h1>
      <div style="display:flex; gap:1rem;">
        <a href="lost-items.html" class="btn btn-danger">Report Lost</a>
        <a href="found-items.html" class="btn btn-secondary">Report Found</a>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3>Recently Reported Lost</h3>
        <p>A quick summary of the latest lost item reports.</p>
        <div id="dashboard-lost-items">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <div class="card">
        <h3>Recently Found Items</h3>
        <p>Here are items people have found recently.</p>
        <div id="dashboard-found-items">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
